<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Prompt Generator 🤖✨</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #08090d;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background-image: 
        radial-gradient(circle at 20% 20%, rgba(0, 242, 254, 0.15) 0%, transparent 45%),
        radial-gradient(circle at 80% 80%, rgba(112, 0, 255, 0.15) 0%, transparent 45%);
    }

    .container {
      width: 100%;
      max-width: 650px;
      background: rgba(21, 28, 44, 0.65);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 32px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
    }

    .header {
      text-align: center;
      margin-bottom: 25px;
    }

    .header h1 {
      font-size: 28px;
      font-weight: 800;
      background: linear-gradient(90deg, #00f2fe, #4facfe);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }

    .header p {
      color: #94a3b8;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #00f2fe;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input, select {
      width: 100%;
      padding: 12px 16px;
      background: rgba(11, 15, 25, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s ease;
    }

    input:focus, select:focus {
      border-color: #00f2fe;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .btn-generate {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: opacity 0.2s ease, transform 0.1s ease;
      margin-top: 10px;
    }

    .btn-generate:hover {
      opacity: 0.95;
    }

    .btn-generate:active {
      transform: scale(0.99);
    }

    /* Output Box */
    .output-card {
      margin-top: 25px;
      background: rgba(11, 15, 25, 0.7);
      border: 1px solid rgba(0, 242, 254, 0.2);
      border-radius: 14px;
      padding: 18px;
    }

    .output-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .output-title {
      font-size: 13px;
      color: #94a3b8;
      font-weight: 600;
    }

    .btn-copy {
      background: rgba(0, 242, 254, 0.15);
      border: 1px solid rgba(0, 242, 254, 0.4);
      color: #00f2fe;
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-copy:hover {
      background: #00f2fe;
      color: #08090d;
    }

    .prompt-result {
      color: #e2e8f0;
      font-size: 14px;
      line-height: 1.5;
      min-height: 60px;
      word-break: break-word;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>AI Prompt Architect 🤖✨</h1>
      <p>Turn basic ideas into high-detail AI prompts in one click.</p>
    </div>

    <!-- Base Subject Input -->
    <div class="form-group">
      <label for="subject">Core Idea / Subject</label>
      <input type="text" id="subject" placeholder="e.g., Cyberpunk samurai cat walking in rain" value="Cyberpunk samurai warrior">
    </div>

    <!-- Dropdowns -->
    <div class="grid-2">
      <div class="form-group">
        <label for="artStyle">Art Style</label>
        <select id="artStyle">
          <option value="Photorealistic, cinematic film render">Cinematic Photo</option>
          <option value="Cyberpunk neon style, futuristic sci-fi aesthetic">Cyberpunk Neon</option>
          <option value="Anime aesthetic, highly detailed Studio Ghibli inspired artwork">Anime / Concept Art</option>
          <option value="3D Pixar style digital art, vibrant colors, smooth textures">3D Pixar Style</option>
          <option value="Dark fantasy oil painting, detailed brush strokes, atmospheric">Dark Fantasy</option>
          <option value="Minimalist vector illustration, clean lines, flat colors">Minimalist Vector</option>
        </select>
      </div>

      <div class="form-group">
        <label for="lighting">Lighting & Mood</label>
        <select id="lighting">
          <option value="dramatic volumetric lighting, golden hour glow">Volumetric & Golden Hour</option>
          <option value="vibrant neon lighting, deep blue and magenta highlights">Cyberpunk Neon Glow</option>
          <option value="cinematic mood lighting, moody shadows, rim light">Moody & Dramatic</option>
          <option value="soft natural sunlight, ambient reflections">Soft Natural Sun</option>
          <option value="dark atmospheric mist with harsh backlighting">Dark & Foggy</option>
        </select>
      </div>
    </div>

    <div class="grid-2">
      <div class="form-group">
        <label for="camera">Camera Angle & Shot</label>
        <select id="camera">
          <option value="close-up portrait shot, 85mm lens, sharp focus on face">Close-up Portrait (85mm)</option>
          <option value="wide-angle cinematic shot, panoramic view, epic perspective">Wide Angle Epic View</option>
          <option value="low-angle heroic perspective, dynamic composition">Low Angle Heroic</option>
          <option value="macro shot, intricate detail, shallow depth of field">Macro Detail Shot</option>
        </select>
      </div>

      <div class="form-group">
        <label for="detailLevel">Detail & Engine Tags</label>
        <select id="detailLevel">
          <option value="unreal engine 5 render, octave render, hyperdetailed texture, 8k resolution, masterpiece">Extreme Realism (8K / UE5)</option>
          <option value="trending on ArtStation, award winning illustration, intricate design">ArtStation Top Rated</option>
          <option value="clean vector lines, ultra sharp details, 4k render">Clean 4K Graphics</option>
        </select>
      </div>
    </div>

    <button class="btn-generate" onclick="generatePrompt()">⚡ Generate Master Prompt</button>

    <!-- Output Box -->
    <div class="output-card">
      <div class="output-header">
        <span class="output-title">GENERATED PROMPT</span>
        <button class="btn-copy" id="copyBtn" onclick="copyPrompt()">📋 Copy</button>
      </div>
      <div class="prompt-result" id="promptOutput">Click generate to build your prompt...</div>
    </div>
  </div>

  <script>
    function generatePrompt() {
      const subject = document.getElementById('subject').value.trim();
      const artStyle = document.getElementById('artStyle').value;
      const lighting = document.getElementById('lighting').value;
      const camera = document.getElementById('camera').value;
      const detailLevel = document.getElementById('detailLevel').value;

      if (!subject) {
        document.getElementById('promptOutput').innerText = "Please enter a core idea or subject!";
        return;
      }

      // Assemble prompt logically
      const fullPrompt = `${subject}, ${artStyle}, ${lighting}, ${camera}, ${detailLevel} --ar 16:9 --v 6.0`;
      
      document.getElementById('promptOutput').innerText = fullPrompt;
    }

    function copyPrompt() {
      const outputText = document.getElementById('promptOutput').innerText;
      if (!outputText || outputText.startsWith("Please enter") || outputText.startsWith("Click generate")) return;

      navigator.clipboard.writeText(outputText).then(() => {
        const copyBtn = document.getElementById('copyBtn');
        copyBtn.innerText = "✓ Copied!";
        setTimeout(() => {
          copyBtn.innerText = "📋 Copy";
        }, 2000);
      });
    }

    // Auto-generate on first load
    generatePrompt();
  </script>

</body>
</html>
